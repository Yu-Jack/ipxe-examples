# Reference:
# https://ranchermanager.docs.rancher.com/getting-started/installation-and-upgrade/install-upgrade-on-a-kubernetes-cluster
# https://github.com/harvester/ipxe-examples/blob/main/vagrant-pxe-harvester/ansible/setup_rancher.yml

- name: Setup Rancher
  hosts: kvm_host
  become: yes
  any_errors_fatal: true
  vars:
    kubeconfig: /etc/rancher/k3s/k3s.yaml

  tasks:
    - name: Download k3s binary
      get_url:
        url: "https://github.com/k3s-io/k3s/releases/download/{{ rancher_config.k3s_version }}/k3s"
        dest: /usr/local/bin/k3s
        mode: "0755"

    - name: Download k3s install script
      get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0755"

    - name: Install k3s using install script with pre-downloaded binary
      shell: INSTALL_K3S_SKIP_DOWNLOAD=true /tmp/k3s-install.sh --write-kubeconfig-mode 644
      environment:
        INSTALL_K3S_VERSION: "{{ rancher_config.k3s_version }}"
        INSTALL_K3S_BIN_DIR: /usr/local/bin

    - name: Wait for k3s to be ready
      shell: /usr/local/bin/k3s kubectl wait --for=condition=Ready nodes --all --timeout=120s
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      retries: 10
      delay: 10

    - name: Download helm tarball
      get_url:
        url: "https://get.helm.sh/helm-{{ rancher_config.helm_version }}-linux-amd64.tar.gz"
        dest: /tmp/helm.tar.gz

    - name: Extract helm tarball
      unarchive:
        src: /tmp/helm.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Install helm binary
      copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        mode: "0755"
        remote_src: yes

    - name: Add helm repos
      shell: |
        /usr/local/bin/helm repo add jetstack https://charts.jetstack.io
        /usr/local/bin/helm repo add rancher {{ rancher_config.repo }}
        /usr/local/bin/helm repo update

    - name: Install cert-manager
      shell: >
        /usr/local/bin/helm install cert-manager jetstack/cert-manager
        --namespace cert-manager
        --create-namespace
        --set crds.enabled=true
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for cert-manager to be ready
      shell: /usr/local/bin/k3s kubectl wait --for=condition=Available deployment --all -n cert-manager --timeout=120s
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      retries: 10
      delay: 10

    - name: Install Rancher
      shell: >
        /usr/local/bin/helm install rancher rancher/rancher
        --namespace cattle-system
        --create-namespace
        --version {{ rancher_config.rancher_version }}
        --set bootstrapPassword={{ rancher_config.bootstrap_password }}
        --set hostname={{ rancher_config.hostname }}
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for Rancher deployment to be ready
      shell: /usr/local/bin/k3s kubectl wait --for=condition=Available deployment/rancher -n cattle-system --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      retries: 10
      delay: 30
